name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar niveles (sql.js)
        run: npm run validate

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que bundle.js está actualizado
        run: git diff --exit-code bundle.js